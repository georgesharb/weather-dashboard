<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Weather Dashboard</title>
</head>
<body>
  <main class="container">
    <h1>Weather Dashboard</h1>
 
    <form id="search-form" class="search">
      <label for="city-input">City</label>
      <input id="city-input" type="text" placeholder="e.g. Beirut">
      <button id="search-btn" type="submit">Search</button>
    </form>
 
    <p id="status" class="status">Search for a city to see the weather.</p>
    <button id="retry-btn" class="retry" type="button" hidden>Retry</button>
 
    <section id="weather" class="weather" hidden>
      <div class="weather-top">
        <div>
          <h2 id="city-name"></h2>
          <p id="description" class="description"></p>
        </div>
        <img id="icon" src="" alt="">
      </div>
 
      <p id="temp" class="temp"></p>
 
      <div class="details">
        <div class="detail">
          <span>Feels like</span>
          <strong id="feels-like"></strong>
        </div>
        <div class="detail">
          <span>Humidity</span>
          <strong id="humidity"></strong>
        </div>
        <div class="detail">
          <span>Wind</span>
          <strong id="wind"></strong>
        </div>
        <div class="detail">
          <span>Min / Max</span>
          <strong id="min-max"></strong>
        </div>
      </div>
    </section>
  </main>
 
  <script type="module" src="/src/main.js"></script>
</body>
</html>
